<section class="quota-section" aria-labelledby="section-{{SECTION_ID}}">
  <div class="section-heading">
    <h2 id="section-{{SECTION_ID}}">{{SECTION_TITLE}}</h2>
    <p>{{SECTION_DESCRIPTION}}</p>
  </div>
  <div class="table-shell">
    <table class="quota-table">
      <thead>
        <tr>
          <th scope="col">{{PLATFORM_HEADER}}</th>
          <th scope="col">{{QUOTA_HEADER}}</th>
          <th scope="col">{{REFERENCE_HEADER}}</th>
          <th scope="col">{{SIGNUP_HEADER}}</th>
        </tr>
      </thead>
      <tbody>{{ROWS}}</tbody>
    </table>
  </div>
</section>
